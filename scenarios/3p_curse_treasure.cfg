#textdomain Maps_from_all_over_the_world
[multiplayer]
    id="3p_curse_treasure"
    name=_"3p_curse_treasure"
    map_file="~add-ons/Maps_from_all_over_the_world/maps/3p_curse_treasure.map"
    allow_era=era_default
    random_start_time="yes"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        side=1
        color=red
        controller=human
        team_name=dwarfteam
        user_team_name= _ "Knalgan Alliance"
        shroud=no
        fog=no
        faction=Knalgan Alliance
        faction_lock=true
        [unit]
            id=duldrus
            name=_"Duldrus"
            type=Dwarvish Guardsman
            x,y=35,7
            facing=sw
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
#define SET_VILLAGE X Y
        [village]
            x={X}
            y={Y}
        [/village]
#enddef
        {SET_VILLAGE 32 7}
        {SET_VILLAGE 36 6}
        {SET_VILLAGE 36 7}
    [/side]

    [side]
        side=2
        color=white
        controller=human
        team_name=undeadteam
        user_team_name= _ "Undead"
        shroud=no
        fog=no
        faction=Undead
        faction_lock=true
        [unit]
            id=galembor
            name=_"Galembor"
            type=Ghost
            x,y=33,34
            facing=nw
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
        {SET_VILLAGE 36 32}
        {SET_VILLAGE 33 35}
        {SET_VILLAGE 32 34}
    [/side]

    [side]
        side=3
        color=orange
        controller=human
        team_name=humanteam
        user_team_name= _ "Loyalists"
        shroud=no
        fog=no
        faction=Loyalists
        faction_lock=true
        [unit]
            id=kandir
            name=_"Kandir"
            type=Heavy Infantryman
            x,y=8,19
            facing=se
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
        {SET_VILLAGE 3 20}
        {SET_VILLAGE 4 20}
        {SET_VILLAGE 6 21}
    [/side]

    [side]
        side=4
        color=black
        controller=ai
        team_name=undead_team
        no_leader=yes
        allow_player=no
        defeat_condition=never
#define SET_UNIT ID X Y TYPE FACING
	[unit]
            id={ID}
            type={TYPE}
            x,y={X},{Y}
            facing={FACING}
            ai_special="guardian"
        [/unit]
#enddef
        {SET_UNIT id1 16 17 Skeleton s}
        {SET_UNIT id2 18 17 Skeleton s}	
	{SET_UNIT id3 20 17 Skeleton s}
	{SET_UNIT id4 16 22 Skeleton n}
	{SET_UNIT id5 18 22 Skeleton n}
	{SET_UNIT id6 20 22 Skeleton n}
	{SET_UNIT id7 25 15 Skeleton se}
	{SET_UNIT id8 26 13 Skeleton se}
	{SET_UNIT id9 27 12 Skeleton se}
	{SET_UNIT id10 32 14 Skeleton nw}
	{SET_UNIT id11 31 16 Skeleton nw}
	{SET_UNIT id12 30 17 Skeleton nw}
	{SET_UNIT id13 25 25 Skeleton ne}
	{SET_UNIT id14 26 26 Skeleton ne}
	{SET_UNIT id15 27 28 Skeleton ne}
	{SET_UNIT id16 30 22 Skeleton sw}
	{SET_UNIT id17 31 24 Skeleton sw}
	{SET_UNIT id18 32 25 Skeleton sw}
	
	{SET_UNIT id19 21 19 Deathblade sw}
        {SET_UNIT id20 21 21 Deathblade sw}
        {SET_UNIT id21 26 16 Deathblade ne}
        {SET_UNIT id22 28 17 Deathblade ne}
        {SET_UNIT id23 26 23 Deathblade se}
        {SET_UNIT id24 28 22 Deathblade se}
    [/side]

    [event]
        name=side 1 turn 1
        [message]
            speaker=duldrus
            message= _ "I knew it, the ancient necromancer had cast a curse. These skeletons are already covered in cobwebs and dust, but as soon as we enter the cave, they will take up axes."
        [/message]
    [/event]

    [event]
        name=side 2 turn 1
        [message]
            speaker=galembor
            message= _ "My looord. There are guardsss ahead. They won't budge unlesssss they're bothered. But we'll have to kill them if we want to get the treeeeasure."
        [/message]
    [/event]
 
    [event]
        name=side 3 turn 1
        [message]
            speaker=kandir
            message= _ "To arms! There are dead people ahead! They will not leave the shelter themselves, they will have to fight in caves."
        [/message]
    [/event]

#define GOLD_PICKUP X Y AMOUNT
    {PLACE_IMAGE items/gold-coins-medium.png {X} {Y}}
    [event]
        name=moveto
        [filter]
            [not]
                side=4
            [/not]
            x,y={X},{Y}
        [/filter]
        [message]
            speaker=$unit.id
            message= _ "The gold is ours!"
        [/message]
        [sound]
            name=gold.ogg
        [/sound]
        [gold]
            side,amount=$unit.side,{AMOUNT}
        [/gold]
        {REMOVE_IMAGE {X} {Y}}
    [/event]
#enddef

{GOLD_PICKUP 23 20 25}
{GOLD_PICKUP 26 18 25}
{GOLD_PICKUP 26 21 25}
{GOLD_PICKUP 25 20 25}

# AntiUnionSystem

    [event]
        name=prestart

        {VARIABLE union_victim nil}

        {VARIABLE union_1_turn_ago nil}
        {VARIABLE union_2_turn_ago nil}
        {VARIABLE union_3_turn_ago nil}

        {VARIABLE attack_1_to_2 false}
        {VARIABLE attack_1_to_3 false}
        {VARIABLE attack_2_to_1 false}
        {VARIABLE attack_2_to_3 false}
        {VARIABLE attack_3_to_1 false}
        {VARIABLE attack_3_to_2 false}

        {VARIABLE main_support_unit nil}
        {VARIABLE is_support_arrive false}
    [/event]  

#define EVENT_ATTACK SIDE_ATTACK SIDE_DEFENCE FLAG_VARIABLE
    [event]
        name=attack
        first_time_only=no
        [filter]
            side={SIDE_ATTACK}
        [/filter]
        [filter_second]
            side={SIDE_DEFENCE}
        [/filter_second]
        {VARIABLE {FLAG_VARIABLE} true}
    [/event]
#enddef
{EVENT_ATTACK 1 2 attack_1_to_2}
{EVENT_ATTACK 1 3 attack_1_to_3}
{EVENT_ATTACK 2 1 attack_2_to_1}
{EVENT_ATTACK 2 3 attack_2_to_3}
{EVENT_ATTACK 3 1 attack_3_to_1}
{EVENT_ATTACK 3 2 attack_3_to_2}

    [event]
        name=turn end
        first_time_only=no
        [lua]
            code = <<
                local vars = wml.variables

                vars.union_3_turn_ago=vars.union_2_turn_ago
                vars.union_2_turn_ago=vars.union_1_turn_ago
                vars.union_1_turn_ago=nil
                
                if vars.attack_2_to_1 and vars.attack_3_to_1 and not vars.attack_2_to_3 and not vars.attack_3_to_2 then
                    vars.union_1_turn_ago=1
                end
                if vars.attack_1_to_2 and vars.attack_3_to_2 and not vars.attack_1_to_3 and not vars.attack_3_to_1 then
                    vars.union_1_turn_ago=2
                end
                if vars.attack_1_to_3 and vars.attack_2_to_3 and not vars.attack_1_to_2 and not vars.attack_2_to_1 then
                    vars.union_1_turn_ago=3
                end

                if vars.union_1_turn_ago==vars.union_2_turn_ago and vars.union_2_turn_ago==vars.union_3_turn_ago then
                    vars.union_victim=vars.union_1_turn_ago
                end
            >>
        [/lua]
               
        {VARIABLE attack_1_to_2 false}
        {VARIABLE attack_1_to_3 false}
        {VARIABLE attack_2_to_1 false}
        {VARIABLE attack_2_to_3 false}
        {VARIABLE attack_3_to_1 false}
        {VARIABLE attack_3_to_2 false}
    [/event]

#define SET_SUPPORT CURRENT_SIDE X Y UNIT_1 UNIT_2 UNIT_3
    [event]
        name=side {CURRENT_SIDE} turn
        first_time_only=no
        {VARIABLE x {X}}
        {VARIABLE y {Y}}
        {VARIABLE unit_1 {UNIT_1}}
        {VARIABLE unit_2 {UNIT_2}}
        {VARIABLE unit_3 {UNIT_3}}
        [lua]
            code = <<
                local vars = wml.variables
                local wml_actions = wesnoth.wml_actions
                local T = wml.tag

                if vars.union_victim==vars.side_number then
                    vars.union_victim=nil

                    local units={vars.unit_1, vars.unit_2, vars.unit_3}
                    local ids={"support1"..vars.turn_number..vars.side_number, "support2"..vars.turn_number..vars.side_number, "support3"..vars.turn_number..vars.side_number}
                    vars.main_support_unit=ids[1]
                    vars.is_support_arrive=true
                
                    for i,val in ipairs(units) do
                        local radius = 1
                        local locs
                        repeat
                            locs = wesnoth.map.find({T["not"] { T.filter {} } , T["and"] { x = vars.x, y = vars.y, radius = radius } })
                            radius = radius + 1
                        until locs[1]

                        local loc_i = mathx.random_choice("1.."..#locs)

                        wml_actions.move_unit_fake({x = string.format("%d,%d", vars.x, locs[loc_i][1]), y = string.format("%d,%d", vars.y, locs[loc_i][2]), type = val, side = vars.side_number})
                        wesnoth.units.to_map({id = ids[i], type = val, side = vars.side_number}, locs[loc_i][1], locs[loc_i][2])
                    end 
                end 
            >>
        [/lua]
        [if]
            [variable]
                name=is_support_arrive
                boolean_equals=true
            [/variable]
            [then]
                [message]
                    speaker=$main_support_unit
                    message= _ "It seems that we have arrived on time. The enemies have united, but there is still hope!"
                [/message]
                {VARIABLE is_support_arrive false}
            [/then]
        [/if]
    [/event]
#enddef
{SET_SUPPORT 1 32 3 "Dwarvish Fighter" "Dwarvish Fighter" "Thug"}
{SET_SUPPORT 2 38 34 "Dark Adept" "Skeleton" "Skeleton Archer"}
{SET_SUPPORT 3 3 22 "Cavalryman" "Spearman" "Spearman"}

# /AntiUnionSystem

[/multiplayer]
