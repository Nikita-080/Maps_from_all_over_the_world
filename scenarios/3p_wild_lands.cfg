#textdomain wesnoth
[multiplayer]
    id="3p_wild_lands"
    name="3p_wild_lands"
    map_file="~add-ons/Maps_from_all_over_the_world/maps/3p_wild_lands.map"
  
    random_start_time="yes"

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        side=1
        controller=human
        team_name=east
        user_team_name= _ "teamname^East"
    [/side]

    [side]
        side=2
        controller=human
        team_name=west
        user_team_name= _ "teamname^West"
    [/side]

    [side]
        side=3
        controller=human
        team_name=south
        user_team_name= _ "teamname^south"
    [/side]
[/multiplayer]
